<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Date Range Picker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap">
  <link rel="stylesheet" href="date-range-picker.css">
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <div class="page">
    <header class="page-header">
      <h1 class="page-header__title">DateRangePicker</h1>
      <a class="page-header__link" href="https://github.com/daishin-sakuma/DateRangePicker" target="_blank" rel="noopener">
        GitHub
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 0 0 3 8.25v10.5A2.25 2.25 0 0 0 5.25 21h10.5A2.25 2.25 0 0 0 18 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25"/></svg>
      </a>
    </header>

    <main class="demo">
      <div id="picker"></div>

      <form class="settings" aria-label="Picker settings">
        <header class="settings__header">
          <h2 class="settings__title">Settings</h2>
          <button class="text-button" type="reset">Reset</button>
        </header>

        <section class="settings__group" aria-labelledby="group-appearance">
          <h3 class="settings__group-title" id="group-appearance">Appearance</h3>

          <fieldset class="settings__field">
            <legend class="settings__label">Theme</legend>
            <div class="segmented">
              <label><input type="radio" name="theme" value="auto" checked><span>Auto</span></label>
              <label><input type="radio" name="theme" value="light"><span>Light</span></label>
              <label><input type="radio" name="theme" value="dark"><span>Dark</span></label>
            </div>
          </fieldset>

          <fieldset class="settings__field">
            <legend class="settings__label">Key color</legend>
            <div class="swatches">
              <label class="swatch" style="--swatch: var(--color-text)"><input type="radio" name="accent" value="" checked><span class="sr-only">Mono</span></label>
              <label class="swatch" style="--swatch: #2563eb"><input type="radio" name="accent" value="#2563eb"><span class="sr-only">Blue</span></label>
              <label class="swatch" style="--swatch: #7c3aed"><input type="radio" name="accent" value="#7c3aed"><span class="sr-only">Violet</span></label>
              <label class="swatch" style="--swatch: #16a34a"><input type="radio" name="accent" value="#16a34a"><span class="sr-only">Green</span></label>
              <label class="swatch" style="--swatch: #ea580c"><input type="radio" name="accent" value="#ea580c"><span class="sr-only">Orange</span></label>
              <label class="swatch" style="--swatch: #e11d48"><input type="radio" name="accent" value="#e11d48"><span class="sr-only">Rose</span></label>
              <label class="swatch swatch--custom">
                <input type="radio" name="accent" value="custom"><span class="sr-only">Custom</span>
                <input type="color" name="customColor" value="#0891b2" aria-label="Custom color">
              </label>
            </div>
          </fieldset>

          <label class="settings__field">
            <span class="settings__label">Corner radius <output name="radiusValue">8px</output></span>
            <input class="slider" type="range" name="radius" min="0" max="20" value="8">
          </label>

          <label class="settings__row">
            <span>Show calendar icon</span>
            <input class="switch" type="checkbox" name="showIcon" role="switch" checked>
          </label>
        </section>

        <section class="settings__group" aria-labelledby="group-calendar">
          <h3 class="settings__group-title" id="group-calendar">Calendar</h3>

          <fieldset class="settings__field">
            <legend class="settings__label">Months</legend>
            <div class="segmented">
              <label><input type="radio" name="months" value="1"><span>1</span></label>
              <label><input type="radio" name="months" value="2" checked><span>2</span></label>
            </div>
          </fieldset>

          <fieldset class="settings__field">
            <legend class="settings__label">Week starts on</legend>
            <div class="segmented">
              <label><input type="radio" name="weekStartsOn" value="0" checked><span>Sunday</span></label>
              <label><input type="radio" name="weekStartsOn" value="1"><span>Monday</span></label>
            </div>
          </fieldset>
        </section>

        <section class="settings__group" aria-labelledby="group-behavior">
          <h3 class="settings__group-title" id="group-behavior">Behavior</h3>

          <fieldset class="settings__field">
            <legend class="settings__label">Open the calendar on</legend>
            <div class="segmented">
              <label><input type="radio" name="openOnHover" value="false" checked><span>Click</span></label>
              <label><input type="radio" name="openOnHover" value="true"><span>Hover</span></label>
            </div>
          </fieldset>

          <fieldset class="settings__field">
            <legend class="settings__label">Close the calendar</legend>
            <label class="settings__row">
              <span>After selecting a range</span>
              <input class="switch" type="checkbox" name="autoClose" role="switch">
            </label>
            <label class="settings__row">
              <span>When the mouse leaves</span>
              <input class="switch" type="checkbox" name="closeOnLeave" role="switch">
            </label>
          </fieldset>
        </section>

        <section class="settings__group" aria-labelledby="group-code">
          <header class="settings__group-header">
            <h3 class="settings__group-title" id="group-code">Code</h3>
            <button class="icon-button" type="button" data-copy aria-label="Copy code" title="Copy code">
              <svg class="icon-button__copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 0 1-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 0 1 1.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 0 0-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 0 1-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 0 0-3.375-3.375h-1.5a1.125 1.125 0 0 1-1.125-1.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H9.75"/></svg>
              <svg class="icon-button__check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>
            </button>
          </header>
          <pre class="code"><code></code></pre>
        </section>
      </form>
    </main>
  </div>

  <script src="date-range-picker.js"></script>
  <script src="demo.js"></script>
</body>
</html>
